<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b476b">
<title>Revisão das frases e orientações ao inspetor — BPF/APPCC</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#f3f8fb;font-family:Arial,Helvetica,sans-serif}
#editor{display:block;width:100%;height:100%;border:0;background:#f3f8fb}
#fallback{position:absolute;inset:0;z-index:-1;padding:20px;background:#f3f8fb;color:#17405a}
#fallback a{color:#086da1}
</style>
</head>
<body>
<div id="fallback"><strong>Revisão das frases e orientações ao inspetor</strong><p><a href="./index.html">Voltar ao menu do aplicativo</a></p></div>
<iframe id="editor" title="Revisão das frases e orientações ao inspetor" src="./individual.html?revisar-frases=1&amp;v=20261107-pagina-independente-v3"></iframe>
<script>
(()=>{
 'use strict';
 const frame=document.getElementById('editor');
 const goHome=()=>window.location.replace('./index.html?v=20261107-pagina-independente-v3');
 let attached=null,openSeen=false;
 function sync(){
  let doc;try{doc=frame.contentDocument;}catch(_){return}
  if(!doc||!doc.body||doc===attached)return;
  attached=doc;
  const style=doc.createElement('style');
  style.textContent='dialog::backdrop{background:#f3f8fb!important} body:has(dialog[open]){background:#f3f8fb!important}';
  doc.head.appendChild(style);
  const titleMatches=()=>[...doc.querySelectorAll('h1,h2,h3,h4,strong')].filter(el=>/Revisão das frases e orientações ao inspetor/i.test(el.textContent||''));
  const isEditorVisible=()=>titleMatches().some(el=>!!el.getClientRects().length);
  function closeClicked(e){
   const btn=e.target.closest?.('button,[role="button"]');
   if(!btn||!/^Fechar$/i.test((btn.innerText||btn.textContent||'').trim()))return;
   if(!isEditorVisible())return;
   window.setTimeout(goHome,60);
  }
  doc.addEventListener('click',closeClicked,true);
  const observer=new MutationObserver(()=>{
   const visible=isEditorVisible();
   if(visible)openSeen=true;
   else if(openSeen){observer.disconnect();goHome()}
  });
  observer.observe(doc.body,{subtree:true,childList:true,attributes:true,attributeFilter:['open','style','class','hidden','aria-hidden']});
  window.setTimeout(()=>{
   if(openSeen)return;
   const btn=[...doc.querySelectorAll('button,a,[role="button"]')].find(el=>/Revisar frases dos inspetores/i.test((el.innerText||el.textContent||'').trim()));
   if(btn)btn.click();
  },900);
 }
 frame.addEventListener('load',sync);
 window.setTimeout(sync,400);
})();
</script>
</body>
</html>
