<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b476b"><title>Revisão das frases e orientações ao inspetor · BPF/APPCC</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#f3f8fb;font:15px Arial,Helvetica,sans-serif;color:#183f52}
#carregando{position:fixed;inset:0;background:#f3f8fb;z-index:3;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center}
#carregando[hidden]{display:none}
#revisao{width:100%;height:100dvh;border:0;display:block;background:#f3f8fb}
a{color:#006b9a}
</style></head>
<body>
<main id="carregando" role="status"><div><h1>Revisão das frases e orientações ao inspetor</h1><p>Abrindo o editor de frases…</p><p id="erro" hidden>Não foi possível abrir automaticamente. <a href="./index.html">Retornar ao menu</a>.</p></div></main>
<iframe id="revisao" title="Editor de frases e orientações ao inspetor" src="./individual.html?revisar-frases=1&amp;v=20261107-revisao-word-v37"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('revisao'),loading=document.getElementById('carregando');
let childDoc=null,editorSeen=false,returning=false,tries=0,lastClick=0;
function home(){
 if(returning)return;
 returning=true;
 window.location.replace('./index.html?v=20261107-revisao-word-v37');
}
function visible(el){return !!(el&&el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden')}
function findEditor(doc){
 const titles=[...doc.querySelectorAll('h1,h2,h3,h4,strong,b')].filter(e=>/Revisão das frases e orientações ao inspetor/i.test(e.textContent||'')&&visible(e));
 for(const title of titles){
  const modal=title.closest('dialog,[role="dialog"],[aria-modal="true"]');
  if(modal&&visible(modal))return modal;
 }
 return doc.querySelector('dialog[open]')||null;
}
function installStyles(doc){
 if(doc.getElementById('revisao-frases-tela-isolada'))return;
 const style=doc.createElement('style');
 style.id='revisao-frases-tela-isolada';
 style.textContent=`
 html,body{background:#f3f8fb!important;min-height:100vh!important}
 body.revisao-isolada> :not(dialog):not([role="dialog"]):not([aria-modal="true"]){visibility:hidden!important;pointer-events:none!important}
 body.revisao-isolada dialog[open],body.revisao-isolada [role="dialog"],body.revisao-isolada [aria-modal="true"]{
 visibility:visible!important;position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:auto!important;z-index:2147483647!important;background:#f7fbfe!important;
 }
 body.revisao-isolada dialog::backdrop{background:#f3f8fb!important}
 `;
 doc.head.appendChild(style);
}
function tick(){
 if(returning)return;
 let doc;try{doc=frame.contentDocument;}catch(e){return}
 if(!doc?.body)return;
 if(doc!==childDoc){
  childDoc=doc;editorSeen=false;tries=0;lastClick=0;installStyles(doc);
  doc.addEventListener('click',e=>{
   const control=e.target.closest?.('button,[role="button"],a');
   if(!control||!/^Fechar$/i.test((control.innerText||control.textContent||'').trim()))return;
   if(findEditor(doc))setTimeout(home,50);
  },true);
 }
 const modal=findEditor(doc);
 if(modal){
  editorSeen=true;doc.body.classList.add('revisao-isolada');loading.hidden=true;
  return;
 }
 if(editorSeen){home();return}
 tries++;
 if(tries>100){
  document.querySelector('#carregando p').textContent='A abertura automática não foi concluída.';
  document.getElementById('erro').hidden=false;return;
 }
 // Aguardar os controles do guia estarem prontos. Repetir abertura enquanto o editor nao estiver visivel.
 const candidates=[...doc.querySelectorAll('button,a,[role="button"],input[type="button"]')];
 const button=candidates.find(e=>/Revisar frases dos inspetores/i.test((e.innerText||e.textContent||e.value||'').trim()));
 if(button&&Date.now()-lastClick>1300){lastClick=Date.now();button.click()}
}
frame.addEventListener('load',tick);
setInterval(tick,250);
})();
</script><script src="./revisao-orientacoes-apoio.js?v=20261108-90F-reunificados" defer></script>
</body></html>
