name: Publicar grupos F com resposta unica BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar desenho de F com resposta unica e caixas selecionaveis
        run: python3 scripts/patch_f_unica_resposta_desenho.py
      - name: Revalidar 4.11.2, 4.3.3, 4.10.3, JSON e Anexo F
        run: node scripts/test_f_unica_resposta_desenho.js
      - name: Validar que o PDF continua paginado sem perda de texto
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: respostas unicas dos Fs conforme desenho, com observacao do grupo"
            git push origin HEAD:main
          fi
