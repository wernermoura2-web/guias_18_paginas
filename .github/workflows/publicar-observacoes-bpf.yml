name: Publicar Anexo F PDF sem orientacao ao inspetor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retirar orientacoes ao inspetor somente do Anexo F PDF
        run: python3 scripts/patch_anexo_pdf_sem_orientacao.py
      - name: Testar anexo sem orientacoes e com frases e observacoes preservadas
        run: node scripts/test_anexo_pdf_sem_orientacao.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: retirar orientação ao inspetor apenas do Anexo F PDF"
            git push origin HEAD:main
          fi
