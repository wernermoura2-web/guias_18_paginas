name: Publicar F4 F5 F6 Sim Nao e manter revisao de frases BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir F4 F5 F6 de 4.10.3 para Sim Nao simples
        run: python3 scripts/patch_4103_f456_sim_nao_simples.py
      - name: Testar resposta Sim Nao simples para F4 F5 F6
        run: node scripts/test_4103_f456_sim_nao_simples.js
      - name: Revalidar original, edicao, retorno e JSON nos dois modos
        run: node scripts/test_menu_revisao_inspetor.js
      - name: Validar integridade dos demais grupos de F
        run: node scripts/test_4102_labs_f5_terceirizadas.js
      - name: Verificar paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: 4.10.3 F4 F5 F6 Sim Não sem checkbox, revisão preservada"
            git push origin HEAD:main
          fi
