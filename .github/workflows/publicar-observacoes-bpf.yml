name: Publicar F5 e F6 de 4.10.3 corrigidos BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir F5 mensal e F6 todos os lotes de 4.10.3
        run: python3 scripts/patch_4103_f5_f6_analises_lotes.py
      - name: Testar F5 e F6 nos modos Individual e Equipe e no PDF
        run: node scripts/test_4103_f5_f6_analises_lotes.js
      - name: Validar paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: distinguir F5 mensal de um lote e F6 cinco unidades em todos os lotes"
            git push origin HEAD:main
          fi
