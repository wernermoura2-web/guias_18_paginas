name: Publicar PDF com continuacao das observacoes BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir divisão do texto no PDF editavel em ambos os modos
        run: python3 scripts/patch_pdf_overflow_geral.py
      - name: Testar PDF editavel com paginas extras usando pdf-lib incorporado
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: PDF editável divide as Observações Gerais entre páginas"
            git push origin HEAD:main
          fi
