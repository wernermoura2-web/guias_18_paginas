name: Publicar 4.10.2 laboratorios e F5 terceirizadas BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar 4.10.2 com laboratorios e F5 com terceirizacao
        run: python3 scripts/patch_4102_labs_4103_f5_terceirizadas.py
      - name: Validar os grupos 4.10.2 e o F5 no HTML e PDF
        run: node scripts/test_4102_labs_f5_terceirizadas.js
      - name: Conferir demais grupos e observacoes
        run: node scripts/test_f_unica_resposta_desenho.js
      - name: Validar paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: 4.10.2 proprio ou terceirizado e F5 mensal terceirizadas"
            git push origin HEAD:main
          fi
