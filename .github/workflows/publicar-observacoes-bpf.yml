name: Publicar menu de revisao de frases e orientacoes BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar menu de revisao de frases e orientacoes
        run: python3 scripts/patch_menu_revisao_inspetor.py
      - name: Revalidar original, edicao, retorno e JSON nos dois modos
        run: node scripts/test_menu_revisao_inspetor.js
      - name: Validar integridade dos demais grupos de F
        run: node scripts/test_4102_labs_f5_terceirizadas.js
      - name: Verificar paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: menu de revisão de frases e orientações com original e restauração"
            git push origin HEAD:main
          fi
