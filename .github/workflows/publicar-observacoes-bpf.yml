name: Publicar espacamento compacto das Observacoes Gerais BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ajustar entrelinhas e ocupar mais espaco nas paginas 14 e 15
        run: python3 scripts/patch_entrelinhas_obs_gerais.py
      - name: Testar PDF e comparar aproveitamento da primeira pagina
        run: node scripts/test_pdf_overflow_geral.js
      - name: Testar fluxo das Observacoes Gerais no HTML
        run: node scripts/test_overflow_observacoes_14_15.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: ajustar entrelinhas e ampliar uso da página 14 no HTML e PDF"
            git push origin HEAD:main
          fi
