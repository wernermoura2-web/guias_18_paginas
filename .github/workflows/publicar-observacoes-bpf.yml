name: Publicar Fs em caixas de selecao BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Criar selecoes Sim e Nao com OBS e NC coletivas nos dois HTML
        run: python3 scripts/patch_f_checkbox_grupos.py
      - name: Testar grupos de F e calculos internos
        run: node scripts/test_f_checkbox_grupos.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: grupos F selecionáveis com Sim Não OBS e NC"
            git push origin HEAD:main
          fi
