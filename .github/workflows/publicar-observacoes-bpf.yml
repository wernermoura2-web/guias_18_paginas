name: Corrigir resumos das observacoes gerais no HTML BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir atualizacao automatica das listas de NC ao abrir JSON
        run: python3 scripts/patch_nc_resumo_ao_carregar.py
      - name: Testar preenchimento antigo e novo nos dois modos
        run: node scripts/test_nc_resumo_ao_carregar.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Corrigir atualizacao de NC resumidas em arquivos JSON antigos"
            git push origin HEAD:main
          fi
