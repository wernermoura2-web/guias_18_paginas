name: Publicar importacao da equipe documentos fotos rotulos responsaveis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ampliar importacao da equipe para documentos fotos rotulos e responsaveis
        run: python3 scripts/patch_equipe_importar_documentos_fotos_responsaveis.py
      - name: Testar transferencias sem sobrescrita e acrescimo de responsaveis
        run: node scripts/test_equipe_documentos_fotos_responsaveis.js
      - name: Validar agrupamento do Anexo F PDF
        run: node scripts/test_anexo_f_obs_unica.js
      - name: Validar integridade e paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: importar documentos, fotos, rótulos e acrescentar responsáveis da equipe"
            git push origin HEAD:main
          fi
