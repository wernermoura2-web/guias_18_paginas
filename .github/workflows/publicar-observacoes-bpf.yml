name: Publicar Anexo F com observacao unica por frase e grupo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Agrupar repeticoes de OBS NC no Anexo F dos dois modos
        run: python3 scripts/patch_anexo_f_obs_unica.py
      - name: Testar NC unica para todas as captacoes de 4.1.2
        run: node scripts/test_anexo_f_obs_unica.js
      - name: Verificar revisao das orientacoes ao inspetor
        run: node scripts/test_menu_revisao_inspetor.js
      - name: Verificar F4 F5 F6 e grupos de CQ
        run: node scripts/test_4103_f456_sim_nao_simples.js
      - name: Validar paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: Anexo F com uma observação por frase, resposta e grupo de unidades"
            git push origin HEAD:main
          fi
