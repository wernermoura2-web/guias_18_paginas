name: Publicar autoajuste de observacoes nos processos HTML e PDF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ajustar textos dos processos ao espaco no HTML e PDF
        run: python3 scripts/patch_autofit_processos_html_pdf.py
      - name: Revalidar ajuste sem recorte e sem novas paginas de processos
        run: node scripts/test_autofit_processos_html_pdf.js
      - name: Testar paginacao existente de listas de nao conformidades
        run: node scripts/test_pdf_overflow_geral.js
      - name: Validar anexo F com observacoes consolidadas
        run: node scripts/test_anexo_f_obs_unica.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: ajustar automaticamente observações dos processos no HTML e PDF"
            git push origin HEAD:main
          fi
