name: Publicar identificacao Conducao e Higienizacao de tampas BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir unidades nos dois modos e no anexo PDF
        run: python3 scripts/patch_escopos_conducao_tampas.py
      - name: Testar escopos nas telas F e nos relatorios
        run: node scripts/test_escopos_conducao_tampas.js
      - name: Verificar paginacao do PDF
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: corrigir Condução e Higienização de tampas nas unidades"
            git push origin HEAD:main
          fi
