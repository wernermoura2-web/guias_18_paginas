name: Publicar espacamento entre observacoes de itens nos dois guias BPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-observacoes-bpf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-guia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos atuais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inserir quebras e pequeno espaco entre observacoes dos itens
        run: python3 scripts/patch_espacamento_observacoes_itens.py
      - name: Revalidar espaco entre itens sem editar texto nem dados das frases
        run: node scripts/test_espacamento_observacoes_itens.js
      - name: Validar OBS unicas no Anexo F
        run: node scripts/test_anexo_f_obs_unica.js
      - name: Validar paginacao PDF com novas quebras de linha
        run: node scripts/test_pdf_overflow_geral.js
      - name: Publicar a revisao na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add individual.html equipe.html index.html sw-guia18.js
          if git diff --cached --quiet; then
            echo "Guia BPF ja atualizado"
          else
            git commit -m "Guia BPF: separar observações dos itens com uma linha em branco"
            git push origin HEAD:main
          fi
