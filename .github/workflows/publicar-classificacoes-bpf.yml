name: Restaurar controles e classificações do Guia BPF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-classificacoes-bpf.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restaurar_473_classificacoes.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html revisao-frases.html sw-guia18.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restaurar respostas do 4.7.3 e mostrar as classificações BPF APPCC'
          git push origin HEAD:main
