name: Publicar correção do item 4.3.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-correcao-f433.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar a correção nos dois modos
        run: |
          git apply <<'PATCH'
          diff --git a/equipe.html b/equipe.html
          index e65fe2b..1140db6 100644
          --- a/equipe.html
          +++ b/equipe.html
          @@ -1053,9 +1053,9 @@ function bpfOpenPhrases(row,page){
            dlg.bpfCommit=()=>{
             const special=['4.3.3','4.10.3','4.11.2'].includes(row.code);
             if(special){
          -   for(const panel of panels){
          -    const selected=panel.entries.filter(e=>['1','0'].includes(values[e.name]));
          -    if(!selected.length){
          +   if(row.code!=='4.3.3')for(const panel of panels){
          +    const selected=panel.entries.some(e=>['1','0'].includes(values[e.name]));
          +    if(!selected){
                alert('Item '+row.code+' — '+panel.label+': selecione uma ou mais caixas em Sim ou Não antes de salvar.');
                return false;
               }
          diff --git a/index.html b/index.html
          index 6d3f6af..10d8c44 100644
          --- a/index.html
          +++ b/index.html
          @@ -61,7 +61,7 @@
                   <span class="action-label">Instalar Guia BPF/APPCC</span>
                   <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                 </button>
          -      <a class="action" href="./equipe.html?v=20261107-revisao-word-v37">
          +      <a class="action" href="./equipe.html?v=20261107-reservatorio-f433-v38">
                   <span class="iconwrap" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/></svg></span>
                   <span class="action-label">Abrir Guia BPF/APPCC</span>
                   <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          diff --git a/individual.html b/individual.html
          index 928e35d..1841d88 100644
          --- a/individual.html
          +++ b/individual.html
          @@ -1053,9 +1053,9 @@ function bpfOpenPhrases(row,page){
            dlg.bpfCommit=()=>{
             const special=['4.3.3','4.10.3','4.11.2'].includes(row.code);
             if(special){
          -   for(const panel of panels){
          -    const selected=panel.entries.filter(e=>['1','0'].includes(values[e.name]));
          -    if(!selected.length){
          +   if(row.code!=='4.3.3')for(const panel of panels){
          +    const selected=panel.entries.some(e=>['1','0'].includes(values[e.name]));
          +    if(!selected){
                alert('Item '+row.code+' — '+panel.label+': selecione uma ou mais caixas em Sim ou Não antes de salvar.');
                return false;
               }
          diff --git a/sw-guia18.js b/sw-guia18.js
          index 08b1082..f0d2798 100644
          --- a/sw-guia18.js
          +++ b/sw-guia18.js
          @@ -1,5 +1,5 @@
           /* Guia BPF: interface amigável e cache offline (06/11/2026). */
          -const CACHE='guia18-20261107-revisao-word-v37';
          +const CACHE='guia18-20261107-reservatorio-f433-v38';
           const ROOT=new URL('./',self.location.href);
           const CORE=['./','./index.html','./manifest.webmanifest','./icon-bpf-appcc-192.png','./icon-bpf-appcc-512.png','./interface-guia-amigavel.js'];
           const IS_GUIDE=url=>/\/(?:equipe|individual)(?:_atualizado)?\.html$/i.test(url.pathname);
          PATCH
          git diff --check
          node scripts/test_pcc_alto_risco_20261107.cjs
      - name: Enviar correção ao repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html individual.html index.html sw-guia18.js
          git commit -m 'Permitir fechar o item 4.3.3 sem respostas'
          git push origin HEAD:main
