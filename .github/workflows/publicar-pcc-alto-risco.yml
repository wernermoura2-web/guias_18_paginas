name: Publicar regra PCC como Alto Risco no Guia BPF APPCC
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-pcc-alto-risco.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versao atual dos guias
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Node e Python
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Aplicar regra no guia individual e equipe, matriz e PDF
        run: python3 scripts/patch_pcc_alto_risco_20261107.py
      - name: Testar regra PCC nos dois modos
        run: node scripts/test_pcc_alto_risco_20261107.cjs
      - name: Conferir integridade
        run: git diff --check
      - name: Publicar arquivos alterados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html sw-guia18.js
          if ! git diff --cached --quiet; then
            git commit -m 'Guia BPF APPCC: PCC nao atendido classifica processo Alto Risco'
            git push origin HEAD:main
          fi
