name: Ajustar tipografia da faixa PCC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-faixa-pcc.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/maiusculas_pcc.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html revisao-frases.html sw-guia18.js scripts/test_pcc_alto_risco_20261107.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'Aumentar texto da Regra PCC em caixa alta e preto'
          git push origin HEAD:main
