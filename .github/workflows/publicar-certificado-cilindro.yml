name: Identificar certificado do cilindro no Guia BPF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-certificado-cilindro.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar e testar a atualização
        run: |
          git apply <<'PATCH'
          diff --git a/equipe.html b/equipe.html
          index 56e27e3..5a523b8 100644
          --- a/equipe.html
          +++ b/equipe.html
          @@ -657,6 +657,7 @@ function bpfPanels(page,row){
            ];
            else parts=range(0,max-1).map(i=>{
             const part={label:'F'+(i+1),indices:[i],composite:false};
          +  if(row.code==='4.12.6')part.label+=' — Certificado do Cilindro em Uso';
             if(row.code==='4.10.5')part.label+=' — '+['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
             if(row.code==='4.10.4')part.checklist=i===0
              ?['IN 161/22 da ANVISA','Res. RDC 717/22 da ANVISA','Portaria SUVISA 4325/2025','Outros']
          diff --git a/index.html b/index.html
          index 1bdccb8..2c07eb8 100644
          --- a/index.html
          +++ b/index.html
          @@ -61,7 +61,7 @@
                   <span class="action-label">Instalar Guia BPF/APPCC</span>
                   <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                 </button>
          -      <a class="action" href="./equipe.html?v=20261107-plano-sim-nao-v47">
          +      <a class="action" href="./equipe.html?v=20261107-guia-sim-nao-v48">
                   <span class="iconwrap" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/></svg></span>
                   <span class="action-label">Abrir Guia BPF/APPCC</span>
                   <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          diff --git a/individual.html b/individual.html
          index 96db47a..667ed7a 100644
          --- a/individual.html
          +++ b/individual.html
          @@ -657,6 +657,7 @@ function bpfPanels(page,row){
            ];
            else parts=range(0,max-1).map(i=>{
             const part={label:'F'+(i+1),indices:[i],composite:false};
          +  if(row.code==='4.12.6')part.label+=' — Certificado do Cilindro em Uso';
             if(row.code==='4.10.5')part.label+=' — '+['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
             if(row.code==='4.10.4')part.checklist=i===0
              ?['IN 161/22 da ANVISA','Res. RDC 717/22 da ANVISA','Portaria SUVISA 4325/2025','Outros']
          diff --git a/sw-guia18.js b/sw-guia18.js
          index b86f68f..fdcdfb4 100644
          --- a/sw-guia18.js
          +++ b/sw-guia18.js
          @@ -1,5 +1,5 @@
           /* Guia BPF: interface amigável e cache offline (06/11/2026). */
          -const CACHE='guia18-20261107-plano-sim-nao-v47';
          +const CACHE='guia18-20261107-guia-sim-nao-v48';
           const ROOT=new URL('./',self.location.href);
           const CORE=['./','./index.html','./manifest.webmanifest','./icon-bpf-appcc-192.png','./icon-bpf-appcc-512.png','./interface-guia-amigavel.js'];
           const IS_GUIDE=url=>/\/(?:equipe|individual)(?:_atualizado)?\.html$/i.test(url.pathname);
          PATCH
          git diff --check
          node scripts/test_pcc_alto_risco_20261107.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html individual.html index.html sw-guia18.js
          git commit -m 'Identificar certificado do cilindro em uso no item 4.12.6'
          git push origin HEAD:main
