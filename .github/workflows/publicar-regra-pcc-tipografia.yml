name: Restaurar faixa da Regra PCC na matriz BPF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-regra-pcc-tipografia.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - run: python3 scripts/patch_regra_pcc_tipografia_20261107.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restaurar textos da matriz e ajustar fonte da Regra PCC'
          git push origin HEAD:main
