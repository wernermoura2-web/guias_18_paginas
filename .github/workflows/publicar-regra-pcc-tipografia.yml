name: Ajustar fonte da Regra PCC na matriz BPF
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-regra-pcc-tipografia.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - name: Reduzir fonte e retirar negrito nos dois guias
        run: python scripts/patch_regra_pcc_tipografia_20261107.py
      - name: Conferir alteracoes
        run: git diff --check
      - name: Publicar modos individual e equipe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html sw-guia18.js
          if ! git diff --cached --quiet; then
            git commit -m 'Guia BPF: reduzir fonte da regra PCC e remover negrito'
            git push origin HEAD:main
          fi
