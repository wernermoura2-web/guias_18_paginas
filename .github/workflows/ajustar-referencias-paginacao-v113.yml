name: Atualizar referências às páginas do Guia BPF
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ajustar-referencias-paginacao-v113.yml"
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar textos de navegação e ajuda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('equipe.html', 'individual.html'):
              p = Path(name)
              s = p.read_text()
              assert 'BPF_ObsNC_Continuacao' in s
              p.write_text(s.replace('documentos da página 15', 'documentos da página 16').replace('(página 14)', '(páginas 14 e 15)'))
          for name in ('manual_equipe.html', 'manual_individual.html'):
              p = Path(name)
              s = p.read_text()
              p.write_text(s.replace('A página 14 de Observações gerais', 'As páginas 14 e 15 de Observações gerais'))
          p = Path('bpf-fotos-somente-nc-20261109.js')
          p.write_text(p.read_text().replace('páginas 16–17', 'páginas 17–18'))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m 'Alinhar textos de ajuda à nova numeração do Guia BPF'
          git push origin HEAD:main
