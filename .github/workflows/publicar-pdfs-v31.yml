name: Publicar PDFs BPF aprovados v31
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publicar-pdfs-v31.yml
      - scripts/render_f_v31.cjs
      - scripts/sincronizar_pdf_v31.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-pdfs-bpf-v31
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar renderizador utilizado na revisão aprovada
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
          python -m pip install pymupdf==1.26.6
          npm install --prefix "$RUNNER_TEMP/bpf-v31-node" @napi-rs/canvas@0.1.100
      - name: Gerar PDFs e verificar campos editáveis
        env:
          NODE_PATH: ${{ runner.temp }}/bpf-v31-node/node_modules
        run: |
          node scripts/render_f_v31.cjs "$RUNNER_TEMP/bpf-v31-pdf"
          python scripts/sincronizar_pdf_v31.py "$RUNNER_TEMP/bpf-v31-pdf"
      - name: Atualizar acesso pelo menu e cache
        run: |
          perl -pi -e 's/20261123-f-padrao-v29/20261123-f-padrao-v31-pdf/g' interface-guia-amigavel.js
          perl -pi -e 's/guia18-20261123-f-padrao-v31-texto-e-pdf/guia18-20261123-f-padrao-v31-pdf-revisado/g; s/interface-guia-amigavel\.js\?v=20261121-recepcao-f22-v22/interface-guia-amigavel.js?v=20261123-f-padrao-v31-pdf/g' sw-guia18.js
          node --check sw-guia18.js
          node --check interface-guia-amigavel.js
      - name: Publicar somente os documentos e os acessos aprovados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add impressao/Guia_BPF_APPCC_Em_Branco_18_Paginas.pdf impressao/Guia_BPF_APPCC_Em_Branco_18_Paginas.pdf.b64 impressao/Guia_Editavel_em_Branco.pdf impressao/Guia_Editavel_Simplificado.pdf individual.html equipe.html interface-guia-amigavel.js sw-guia18.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publica PDFs v31: recepcao e higienizacao no padrao da captacao'
            git push origin HEAD:main
          fi
