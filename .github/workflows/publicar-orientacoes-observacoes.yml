name: Publicar orientações de observações e botões F
on:
  push:
    branches: [main]
    paths:
      - scripts/patch_observacoes_f_20261107.py
      - .github/workflows/publicar-orientacoes-observacoes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_observacoes_f_20261107.py
      - run: node scripts/test_anexo_f_obs_unica.js
      - name: Publicar guias atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html sw-guia18.js index.html individual_atualizado.html equipe_atualizado.html
          if ! git diff --cached --quiet; then
            git commit -m 'Guia BPF: corrigir botões F e orientar o registro de observações'
            git push origin HEAD:main
          fi
