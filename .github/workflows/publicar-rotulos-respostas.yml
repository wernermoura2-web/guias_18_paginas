name: Atualizar os rótulos das caixas de seleção
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-rotulos-respostas.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar e conferir a revisão
        run: |
          git apply <<'PATCH'
          diff --git a/equipe.html b/equipe.html
          index 45c455a..22c355f 100644
          --- a/equipe.html
          +++ b/equipe.html
          @@ -672,9 +672,10 @@ function bpfPanels(page,row){
            ];
            else parts=range(0,max-1).map(i=>{
             const part={label:'F'+(i+1),indices:[i],composite:false};
          -  if(row.code==='4.11.1')part.label+=' — Supervisão e Capacitação';
          +  if(row.code==='4.11.1')part.answerCaption='Supervisão e Capacitação';
             if(row.code==='4.12.6')part.label+=' — Certificado do Cilindro em Uso';
          -  if(row.code==='4.10.5')part.label+=' — '+['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
          +  if(row.code==='4.10.5')part.answerCaption=['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
          +  if(part.answerCaption)part.label+=' — '+part.answerCaption;
             if(row.code==='4.10.4')part.checklist=i===0
              ?['IN 161/22 da ANVISA','Res. RDC 717/22 da ANVISA','Portaria SUVISA 4325/2025','Outros']
              :['Reanálise','Parada do Envase','Higienização','Recolhimento','Quarentena','Aprovação','Outros'];
          @@ -1155,7 +1156,7 @@ function bpfOpenPhrases(row,page){
               }
               const detail=bpfSplitPanel(row,panel)?bpfUnifiedOption(row,entry):panel.composite?'F'+(entry.index+1)+' — '+entry.phrase.text:'';
               const scopeText=[11,12].includes(page.page)&&!panel.composite?bpfAnswerLabel(answer):panel.composite&&row.scopes.length===1?'':bpfScopeLabel(page,entry.scope)+(panel.composite?' — ':'');
          -    const caption=document.createElement('span');caption.textContent=splitHygiene?bpfScopeLabel(page,entry.scope):scopeText+detail;
          +    const caption=document.createElement('span');caption.textContent=panel.answerCaption??(splitHygiene?bpfScopeLabel(page,entry.scope):scopeText+detail);
               input.onchange=()=>{
                values[entry.name]=input.checked?answer:values[entry.name]===answer?'':values[entry.name];
                if(page.page===8&&['4.6.3','4.6.7'].includes(row.code)&&!values[entry.name])values[entry.scope.name]='Off';
          diff --git a/index.html b/index.html
          index e65870f..98871a9 100644
          --- a/index.html
          +++ b/index.html
          @@ -61,7 +61,7 @@
                   <span class="action-label">Instalar Guia BPF/APPCC</span>
                   <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                 </button>
          -      <a class="action" href="./equipe.html?v=20261107-responsaveis-v50">
          +      <a class="action" href="./equipe.html?v=20261107-rotulos-respostas-v51">
                   <span class="iconwrap" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/></svg></span>
                   <span class="action-label">Abrir Guia BPF/APPCC</span>
                   <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          diff --git a/individual.html b/individual.html
          index f561074..746942d 100644
          --- a/individual.html
          +++ b/individual.html
          @@ -672,9 +672,10 @@ function bpfPanels(page,row){
            ];
            else parts=range(0,max-1).map(i=>{
             const part={label:'F'+(i+1),indices:[i],composite:false};
          -  if(row.code==='4.11.1')part.label+=' — Supervisão e Capacitação';
          +  if(row.code==='4.11.1')part.answerCaption='Supervisão e Capacitação';
             if(row.code==='4.12.6')part.label+=' — Certificado do Cilindro em Uso';
          -  if(row.code==='4.10.5')part.label+=' — '+['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
          +  if(row.code==='4.10.5')part.answerCaption=['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
          +  if(part.answerCaption)part.label+=' — '+part.answerCaption;
             if(row.code==='4.10.4')part.checklist=i===0
              ?['IN 161/22 da ANVISA','Res. RDC 717/22 da ANVISA','Portaria SUVISA 4325/2025','Outros']
              :['Reanálise','Parada do Envase','Higienização','Recolhimento','Quarentena','Aprovação','Outros'];
          @@ -1155,7 +1156,7 @@ function bpfOpenPhrases(row,page){
               }
               const detail=bpfSplitPanel(row,panel)?bpfUnifiedOption(row,entry):panel.composite?'F'+(entry.index+1)+' — '+entry.phrase.text:'';
               const scopeText=[11,12].includes(page.page)&&!panel.composite?bpfAnswerLabel(answer):panel.composite&&row.scopes.length===1?'':bpfScopeLabel(page,entry.scope)+(panel.composite?' — ':'');
          -    const caption=document.createElement('span');caption.textContent=splitHygiene?bpfScopeLabel(page,entry.scope):scopeText+detail;
          +    const caption=document.createElement('span');caption.textContent=panel.answerCaption??(splitHygiene?bpfScopeLabel(page,entry.scope):scopeText+detail);
               input.onchange=()=>{
                values[entry.name]=input.checked?answer:values[entry.name]===answer?'':values[entry.name];
                if(page.page===8&&['4.6.3','4.6.7'].includes(row.code)&&!values[entry.name])values[entry.scope.name]='Off';
          diff --git a/sw-guia18.js b/sw-guia18.js
          index 0147ddc..27b099f 100644
          --- a/sw-guia18.js
          +++ b/sw-guia18.js
          @@ -1,5 +1,5 @@
           /* Guia BPF: interface amigável e cache offline (06/11/2026). */
          -const CACHE='guia18-20261107-responsaveis-v50';
          +const CACHE='guia18-20261107-rotulos-respostas-v51';
           const ROOT=new URL('./',self.location.href);
           const CORE=['./','./index.html','./manifest.webmanifest','./icon-bpf-appcc-192.png','./icon-bpf-appcc-512.png','./interface-guia-amigavel.js'];
           const IS_GUIDE=url=>/\/(?:equipe|individual)(?:_atualizado)?\.html$/i.test(url.pathname);
          PATCH
          git diff --check
          node scripts/test_pcc_alto_risco_20261107.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html individual.html index.html sw-guia18.js
          git commit -m 'Identificar caixas de seleção pelos nomes das verificações'
          git push origin HEAD:main
