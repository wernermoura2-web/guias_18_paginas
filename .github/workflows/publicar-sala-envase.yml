name: Atualizar F1 da sala de envase
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-sala-envase.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ajustar_f1_sala_envase.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html revisao-frases.html sw-guia18.js
          git diff --cached --quiet && exit 0
          git commit -m 'Separar sete verificações no F1 do item 4.7.2'
          git push origin HEAD:main
