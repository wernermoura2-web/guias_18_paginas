name: Atualizar exemplos de OBS e NC nos guias
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-revisao-exemplos.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_revisao_observacoes.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html
          git diff --cached --quiet && exit 0
          git commit -m 'Separar exemplos de Sim e Não na revisão dos dois guias'
          git push origin HEAD:main
