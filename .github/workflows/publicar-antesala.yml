name: Agrupar verificações da antesala
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-antesala.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agrupar_475.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html revisao-frases.html sw-guia18.js
          git diff --cached --quiet && exit 0
          git commit -m 'Identificar opções agrupadas como F2 no resumo de NC'
          git push origin HEAD:main
