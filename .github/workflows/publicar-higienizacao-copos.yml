name: Atualizar os itens de higienização no Guia BPF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-higienizacao-copos.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar as correções nos dois modos
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          
          def compact(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))
          
          for name in ("equipe.html", "individual.html"):
              path = Path(name)
              with path.open(newline="") as f:
                  html = f.read()
          
              def replace(old, new):
                  global html
                  assert html.count(old) == 1, (name, old[:100])
                  html = html.replace(old, new, 1)
          
              pages = json.loads(re.search(r"const BPF_PHRASES=(\[.*?\]);", html, re.S)[1])
              for page_id in (7, 8):
                  page = next(p for p in pages if p["page"] == page_id)
                  for row in page["rows"]:
                      if row["code"] == "4.6.7" and page_id == 8:
                          for scope in row["scopes"]:
                              old = compact(scope)
                              assert len(scope["phrases"]) == 1 and not scope["phrases"][0]["allowNA"]
                              scope["phrases"][0]["allowNA"] = True
                              replace(old, compact(scope))
                      if row["code"] == "4.6.10":
                          old = compact(row)
                          for source in [row, *row["scopes"]]:
                              assert len(source["phrases"]) == 4
                              assert "permanecer fechada" in source["phrases"][2]["text"]
                              source["phrases"].pop()
                          replace(old, compact(row))
          
                      if row["code"] == "4.6.12":
                          old = compact(row)
                          for source in [row, *row["scopes"]]:
                              assert source["phrases"][1]["fieldSuffix"] == "DisponibilidadePOP"
                              assert source["phrases"][1]["allowNA"]
                              source["phrases"][1]["allowNA"] = False
                          replace(old, compact(row))
          
              replace(
                  "if(row.code==='4.6.10'&&i>=2){part.storageId=i===2?3:2;part.exampleId=i;}",
                  "if(row.code==='4.6.10'&&i===2){part.storageId=3;part.exampleId=2;}",
              )
              replace(
                  "   for(const entry of panel.entries){\n    if(answer==='2'&&!entry.phrase.allowNA",
                  """   if(answer==='2'&&page.page===8&&['4.6.3','4.6.7'].includes(row.code)){
              const hint=document.createElement('p');hint.textContent='Para copos descartáveis, marque Não se aplica na linha correspondente.';box.append(hint);
             }
             for(const entry of panel.entries){
              if(answer==='2'&&!entry.phrase.allowNA""",
              )
          
              replace(
                  "row.code==='4.2.9'||(row.code!=='4.3.6'&&popItems.includes(row.code))",
                  "row.code==='4.2.9'||row.code==='4.5.8'",
              )
              replace(
                  "(row.code==='4.3.6'&&entry.index===1)",
                  "(['4.3.6','4.6.12'].includes(row.code)&&entry.index===1)",
              )
              replace(
                  " if(corrected&&v===values)bpfSyncObservation(r,p);",
                  r""" const removedF4=r.code==='4.6.10'&&/F4 — (?:Sim|Não|Não se aplica) \(/.test(v[bpfSummaryName(p,r)]||'');
           if((corrected||removedF4)&&v===values)bpfSyncObservation(r,p);""",
              )
          
              guide = json.JSONDecoder().raw_decode(html.split("const GUIDE_DATA=", 1)[1])[0]
              for field in ("fill_2_4", "fill_3_4", "fill_4_4", "fill_6_5"):
                  item = guide["fields"][field]
                  old = compact(item)
                  calc = item["calc"]
                  if field == "fill_2_4":
                      assert calc.count('i === 0 && resposta === "2"') == 1
                      calc = calc.replace('i === 0 && resposta === "2"', '(i === 0 || i === 1) && resposta === "2"')
                  else:
                      assert calc.count("if (g1 === 2){") == calc.count("if (isNaN(soma)") == 1
                      calc = calc.replace("if (g1 === 2){", 'var enxagueNA = g2 === 2;\r\nif (enxagueNA) g2 = 0;\r\nif (g1 === 2){')
                      calc = calc.replace("if (isNaN(soma)", "if (enxagueNA) total--;\r\nif (isNaN(soma)")
                  item["calc"] = calc
                  replace(old, compact(item))
          
              replace(
                  "bpfInitFields(D);\nD.fields.BPF_ObsGeneralFlow",
                  """// Alinha as opções do enxágue final ao padrão de três respostas do item 4.6.3.
          const bpfRinseCells=[];
          for(const [name,model] of [['Group351','Group350'],['Group357','Group356'],['Group363','Group362']]){
           const first=D.widgets.find(w=>w.name===name&&w.state==='1');
           const options=['1','0','2'].map((state,i)=>{
            const original=D.widgets.find(w=>w.name===model&&w.state===state);
            const [left,,right]=original.rect;
            const rect=[left,first.rect[1],right,first.rect[3]];
            const widget=D.widgets.find(w=>w.name===name&&w.state===state);
            if(widget)widget.rect=rect;
            else D.widgets.push({...first,state,rect});
            return {state,rect,label:['SIM','NÃO','NA'][i]};
           });
           const rect=[options[0].rect[0]-.7,first.rect[1]-1.5,options[2].rect[2]+11.5,first.rect[3]+1.5];
           bpfRinseCells.push({name,options,rect,size:first.size});
          }
          bpfInitFields(D);
          D.fields.BPF_ObsGeneralFlow""",
              )
              replace(
                  "function bpfDateToISO(value){",
                  """for(const cell of bpfRinseCells){
           const cover=document.createElement('div');
           cover.className='overlay';cover.style.background='white';cover.style.pointerEvents='none';
           place(cover,cell);host.children[8].append(cover);
           for(const {rect,label} of cell.options){
            const text=document.createElement('span');text.className='overlay';text.textContent=label;
            text.style.cssText='color:black;font:1.12cqw/1 Arial;display:flex;align-items:center;pointer-events:none';
            place(text,{size:cell.size,rect:[rect[2]+1.5,rect[1],rect[2]+18,rect[3]]});
            host.children[8].append(text);
           }
          }
          function bpfDateToISO(value){""",
              )
              replace(
                  " bpfPreparePhotoPdf(pdf,form,observationFont);",
                  """ const rinsePage=pdf.getPage(8);
           rinsePage.pushOperators(PDFLib.pushGraphicsState(),PDFLib.setCharacterSpacing(0),PDFLib.setWordSpacing(0));
           for(const {name,options,rect} of bpfRinseCells){
            const [x,y,right,top]=rect,group=form.getRadioGroup(name);
            rinsePage.drawRectangle({x,y,width:right-x,height:top-y,color:PDFLib.rgb(1,1,1)});
            for(const {state,rect:[left,bottom,end,upper],label} of options){
             const width=end-left,height=upper-bottom;
             const widget=group.acroField.getWidgets().find(w=>w.getOnValue()?.decodeText()===state);
             if(widget)widget.setRectangle({x:left,y:bottom,width,height});
             else group.addOptionToPage(state,rinsePage,{x:left+.3,y:bottom+.3,width:width-.6,height:height-.6,borderWidth:.6});
             rinsePage.drawText(label,{x:end+1.5,y:bottom+1.7,size:6.6,font:observationFont,color:ink});
            }
           }
           rinsePage.pushOperators(PDFLib.popGraphicsState());
           bpfPreparePhotoPdf(pdf,form,observationFont);""",
              )
          
              with path.open("w", newline="") as f:
                  f.write(html)
          
          for name in ("index.html", "sw-guia18.js"):
              path = Path(name)
              source = path.read_text()
              old = "20261107-higienizacao-f463-v41"
              assert source.count(old) == 1, name
              path.write_text(source.replace(old, "20261107-higienizacao-copos-v42"))
          PY
          git diff --check
          node scripts/test_pcc_alto_risco_20261107.cjs
      - name: Enviar correções ao repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html individual.html index.html sw-guia18.js
          git commit -m 'Ajustar respostas e frases na higienização de embalagens'
          git push origin HEAD:main
