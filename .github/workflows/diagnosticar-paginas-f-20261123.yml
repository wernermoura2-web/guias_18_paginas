name: Diagnosticar correspondencia das paginas 6-9 BPF
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnosticar_paginas_f_20261123.py
      - .github/workflows/diagnosticar-paginas-f-20261123.yml
permissions:
  contents: write
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - run: python scripts/diagnosticar_paginas_f_20261123.py
      - name: Guardar evidencias verificaveis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostico-f-paginas-20261123
          if ! git diff --cached --quiet; then
            git commit -m 'Diagnostico PDF: correspondencia de indices e paginas F'
            git push origin HEAD:main
          fi
