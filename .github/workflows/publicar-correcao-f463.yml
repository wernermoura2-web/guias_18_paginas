name: Incluir Não se aplica no F1 do item 4.6.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-correcao-f463.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar a correção nos dois modos
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          
          for name in ("equipe.html", "individual.html"):
              path = Path(name)
              with path.open(newline="") as f:
                  source = f.read()
              data = re.search(r"const BPF_PHRASES=(\[.*?\]);", source, re.S)
              pages = json.loads(data[1])
              for page_id, prefix in ((7, ("Group3000", "Group3001", "Group3002")), (8, ("Group350", "Group356", "Group362"))):
                  page = next(p for p in pages if p["page"] == page_id)
                  row = next(r for r in page["rows"] if r["code"] == "4.6.3")
                  assert [s["name"] for s in row["scopes"]] == list(prefix)
                  for column, scope in enumerate(row["scopes"], 1):
                      assert scope["col"] == column and len(scope["phrases"]) == 1
                      phrase = scope["phrases"][0]
                      assert phrase["appcc"] == "PCC" and phrase["allowNA"] == (page_id == 8)
                      if page_id == 8:
                          continue
                      old = json.dumps(scope, ensure_ascii=False, separators=(",", ":"))
                      phrase["allowNA"] = True
                      new = json.dumps(scope, ensure_ascii=False, separators=(",", ":"))
                      assert source.count(old) == 1, (name, scope["name"])
                      source = source.replace(old, new)
              with path.open("w", newline="") as f:
                  f.write(source)
          
          for name in ("index.html", "sw-guia18.js"):
              path = Path(name)
              source = path.read_text()
              old = "20261107-reservatorio-f436-v40"
              assert source.count(old) == 1, name
              path.write_text(source.replace(old, "20261107-higienizacao-f463-v41"))
          PY
          git diff --check
          node scripts/test_pcc_alto_risco_20261107.cjs
      - name: Enviar correção ao repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html individual.html index.html sw-guia18.js
          git commit -m 'Incluir Não se aplica no F1 do item 4.6.3'
          git push origin HEAD:main
