name: Atualizar as respostas de higienização e controle da qualidade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-revisao-sim-nao.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar e testar a atualização
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          
          def compact(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))
          
          for name in ("equipe.html", "individual.html"):
              path = Path(name)
              with path.open(newline="") as f:
                  html = f.read()
          
              def replace(old, new):
                  global html
                  assert html.count(old) == 1, (name, old[:130])
                  html = html.replace(old, new, 1)
          
              pages = json.loads(re.search(r"const BPF_PHRASES=(\[.*?\]);", html, re.S)[1])
              returns = next(p for p in pages if p["page"] == 7)
              for scope in next(r for r in returns["rows"] if r["code"] == "4.6.3")["scopes"]:
                  old = compact(scope)
                  assert scope["phrases"][0]["allowNA"]
                  scope["phrases"][0]["allowNA"] = False
                  replace(old, compact(scope))
          
              replace(
                  "  if(row.code==='4.10.4')part.checklist=i===0",
                  """  if(row.code==='4.10.5')part.label+=' — '+['Composição equivalente','Laudo Res. RDC 717/22','Boletim LAMIN'][i];
            if(row.code==='4.10.4')part.checklist=i===0""",
              )
              replace(
                  "function bpfAllowsDependentNA(row,entry,v){",
                  """function bpfAllowsDependentNA(row,entry,v){
           if(row.code==='4.6.3'&&!entry.scope.phrases[entry.index]?.allowNA)return false;""",
              )
              replace(
                  """ let corrected=false;
           for(const s of r.scopes){""",
                  """ if(r.code==='4.10.4')for(const panel of bpfPanels(p,r))bpfChecklistApply(p,r,panel,v);
           let corrected=false;
           for(const s of r.scopes){""",
              )
              replace(
                  """  if(panel.checklist){
             const options=bpfChecklistLabels(page,row,panel);
             if(options.length)entries.push(panel.label+' — '+options.join(', '));
            }
            for(const [answer,label]""",
                  """  if(panel.checklist){
             const previous=bpfChecklistLabels(page,row,panel);
             if(previous.length)entries.push(panel.label+' — Registro anterior sem classificação: '+previous.join(', '));
             for(const answer of ['1','0']){
              const options=bpfChecklistLabels(page,row,panel,answer);
              if(!options.length)continue;
              const note=String(values[bpfGroupNoteName(page,row,panel,answer)]||'').trim();
              entries.push(panel.label+' — '+bpfAnswerLabel(answer)+' ('+options.join(', ')+')'+(note?': '+bpfObservationMarker(answer,panel.entries)+note:''));
             }
             if(bpfChecklistHasAnswers(page,row,panel,values))continue;
            }
            for(const [answer,label]""",
              )
              replace(
                  """  if(panel.checklist)for(const [kind,label] of [['Selected','opções registradas'],['Other','Outros']]){
             const name=bpfUnifiedKey(page,row,panel,kind);
             data.fields[name]={name,type:'/Tx',flags:0,label:row.code+' '+panel.label+' — '+label,options:[],calc:'',phrasePage:page.page};
            }""",
                  """  if(panel.checklist)for(const answer of ['', '1','0'])for(const [kind,label] of [['Selected','opções registradas'],['Other','Outros']]){
             const name=bpfChecklistKey(page,row,panel,kind,answer);
             data.fields[name]={name,type:'/Tx',flags:0,label:row.code+' '+panel.label+' — '+label+(answer?' — '+bpfAnswerLabel(answer):''),options:[],calc:'',phrasePage:page.page};
            }""",
              )
              replace(
                  r"""function bpfChecklistSelected(page,row,panel){
           try{
            const saved=JSON.parse(values[bpfUnifiedKey(page,row,panel,'Selected')]||'[]');
            return Array.isArray(saved)?panel.checklist.filter(option=>saved.includes(option)):[];
           }catch(_){return [];}
          }
          function bpfChecklistLabels(page,row,panel){
           const other=String(values[bpfUnifiedOtherKey(page,row,panel)]||'').replace(/\s+/g,' ').trim();
           return bpfChecklistSelected(page,row,panel).map(option=>option==='Outros'&&other?'Outros: '+other:option);
          }""",
                  r"""function bpfChecklistKey(page,row,panel,kind,answer){
           return bpfUnifiedKey(page,row,panel,kind+(answer?'_'+answer:''));
          }
          function bpfChecklistSelected(page,row,panel,answer,v=values){
           try{
            const saved=JSON.parse(v[bpfChecklistKey(page,row,panel,'Selected',answer)]||'[]');
            return Array.isArray(saved)?panel.checklist.filter(option=>saved.includes(option)):[];
           }catch(_){return [];}
          }
          function bpfChecklistLabels(page,row,panel,answer){
           const other=String(values[bpfChecklistKey(page,row,panel,'Other',answer)]||'').replace(/\s+/g,' ').trim();
           return bpfChecklistSelected(page,row,panel,answer).map(option=>option==='Outros'&&other?'Outros: '+other:option);
          }
          function bpfChecklistHasAnswers(page,row,panel,v){
           return ['1','0'].some(answer=>v[bpfChecklistKey(page,row,panel,'Selected',answer)]);
          }
          function bpfChecklistApply(page,row,panel,v){
           if(!bpfChecklistHasAnswers(page,row,panel,v))return;
           const no=bpfChecklistSelected(page,row,panel,'0',v);
           const yes=bpfChecklistSelected(page,row,panel,'1',v);
           const answer=no.length?'0':yes.length?'1':'';
           const entry=panel.entries[0];
           v[entry.name]=answer;
           v[bpfNoteName(entry.scope,entry.index)]=answer?String(v[bpfGroupNoteName(page,row,panel,answer)]||''):'';
           if(!answer)v[entry.scope.name]='Off';
          }""",
              )
          
              start = html.index("  if(panel.checklist){\n   const title=panel.id===0?")
              end = html.index("  if(!entry){content.append(card);continue;}", start)
              html = html[:start] + """  if(panel.checklist){
             const previous=bpfChecklistLabels(page,row,panel);
             const evaluation=bpfAnswerLabel(values[entry.name]);
             if(previous.length||(!bpfChecklistHasAnswers(page,row,panel,values)&&evaluation)){
              const history=document.createElement('p');history.className='bpf-guidance';
              history.textContent=[previous.length?'Registro anterior sem classificação: '+previous.join(', '):'',!bpfChecklistHasAnswers(page,row,panel,values)&&evaluation?'Avaliação anterior: '+evaluation:''].filter(Boolean).join('. ')+'.';
              card.append(history);
             }
            }
          """ + html[end:]
              replace(
                  """  if(!panel.composite&&panel.entries.some(e=>e.phrase.allowNA||values[e.name]==='2'))allowed.push(['2','Não se aplica',null]);
            for(const [answer,heading,noteHeading] of allowed){""",
                  """  if(!panel.checklist&&!panel.composite&&panel.entries.some(e=>e.phrase.allowNA||values[e.name]==='2'))allowed.push(['2','Não se aplica',null]);
            const checklistInputs=new Map();
            for(const [answer,heading,noteHeading] of allowed){""",
              )
              replace(
                  """   for(const entry of panel.entries){
              if(answer==='2'&&!entry.phrase.allowNA""",
                  """   if(panel.checklist){
              const selectedKey=bpfChecklistKey(page,row,panel,'Selected',answer);
              const otherKey=bpfChecklistKey(page,row,panel,'Other',answer);
              const opposite=answer==='1'?'0':'1';
              const other=document.createElement('input');other.type='text';other.dataset.checklistOther=otherKey;
              other.placeholder=panel.id===0?'Identifique as outras referências':'Descreva as outras medidas';
              other.setAttribute('aria-label',other.placeholder+' — '+heading);
              other.style.cssText='width:100%;margin-top:6px;padding:8px;font:inherit';
              other.value=String(values[otherKey]||'');
              other.hidden=other.disabled=!bpfChecklistSelected(page,row,panel,answer).includes('Outros');
              other.oninput=()=>{values[otherKey]=other.value;changed();};
              for(const option of panel.checklist){
               const label=document.createElement('label');label.className='bpf-answer-item';
               const check=document.createElement('input');check.type='checkbox';
               check.checked=bpfChecklistSelected(page,row,panel,answer).includes(option);
               checklistInputs.set(answer+option,check);
               check.onchange=()=>{
                const selected=new Set(bpfChecklistSelected(page,row,panel,answer));
                if(check.checked)selected.add(option);else selected.delete(option);
                values[selectedKey]=JSON.stringify([...selected]);
                if(option!=='Outros'&&check.checked){
                 const counterpart=checklistInputs.get(opposite+option);
                 if(counterpart.checked){
                  counterpart.checked=false;
                  const remaining=bpfChecklistSelected(page,row,panel,opposite).filter(value=>value!==option);
                  values[bpfChecklistKey(page,row,panel,'Selected',opposite)]=JSON.stringify(remaining);
                 }
                }
                other.hidden=other.disabled=!selected.has('Outros');
                if(other.hidden)values[otherKey]=other.value='';
                changed();recalc();
               };
               const text=document.createElement('span');text.textContent=option;label.append(check,text);box.append(label);
              }
              box.append(other);
             }else for(const entry of panel.entries){
              if(answer==='2'&&!entry.phrase.allowNA""",
              )
              replace(
                  """   if(panel.checklist){
              const key=bpfUnifiedOtherKey(page,row,panel);
              if(bpfChecklistSelected(page,row,panel).includes('Outros')&&!String(values[key]||'').trim()){
               content.querySelector('input[data-checklist-other="'+key+'"]')?.focus();
               alert('Item '+row.code+' — '+panel.label+': preencha o campo Outros.');return false;
              }
              continue;
             }
             const noSelected=bpfPanelRecords(row,panel).some(e=>values[e.name]==='0');""",
                  """   if(panel.checklist)for(const answer of ['1','0']){
              const key=bpfChecklistKey(page,row,panel,'Other',answer);
              if(bpfChecklistSelected(page,row,panel,answer).includes('Outros')&&!String(values[key]||'').trim()){
               content.querySelector('input[data-checklist-other="'+key+'"]')?.focus();
               alert('Item '+row.code+' — '+panel.label+' — '+bpfAnswerLabel(answer)+': preencha o campo Outros.');return false;
              }
             }
             const noSelected=panel.checklist?bpfChecklistSelected(page,row,panel,'0').length>0:bpfPanelRecords(row,panel).some(e=>values[e.name]==='0');""",
              )
              replace(
                  """  for(const panel of panels)for(const e of panel.checklist?[]:bpfPanelRecords(row,panel)){
             const v=values[e.name];""",
                  """  for(const panel of panels)if(panel.checklist)bpfChecklistApply(page,row,panel,values);
            for(const panel of panels.filter(panel=>!panel.checklist))for(const e of bpfPanelRecords(row,panel)){
             const v=values[e.name];""",
              )
              replace(
                  """  for(const panel of panels.filter(panel=>panel.checklist)){
             const checklist=bpfChecklistLabels(page,row,panel);
             if(checklist.length)result.push({page,row,panel,checklist});
            }""",
                  """  for(const panel of panels.filter(panel=>panel.checklist))for(const answer of ['', '1','0']){
             const checklist=bpfChecklistLabels(page,row,panel,answer);
             const note=answer?String(values[bpfGroupNoteName(page,row,panel,answer)]||'').trim():'';
             if(checklist.length)result.push({page,row,panel,checklist,answer,note});
            }""",
              )
              replace(
                  """   if(groupedPanels.some(panel=>panel.entries.some(e=>e.index===i)))return;""",
                  """   if(groupedPanels.some(panel=>panel.entries.some(e=>e.index===i)))return;
             if(panels.some(panel=>panel.checklist&&panel.id===i&&bpfChecklistHasAnswers(page,row,panel,values)))return;""",
              )
              replace(
                  """   text('Página '+(item.page.page+1)+' | Item '+item.row.code+' | '+item.panel.label,9,true);
             for(const option of item.checklist)text('- '+option,8.5);""",
                  """   text('Página '+(item.page.page+1)+' | Item '+item.row.code+' | '+item.panel.label+' | '+(bpfAnswerLabel(item.answer)||'Registro anterior sem classificação'),9,true);
             text(item.row.phrases[item.panel.id].text);
             for(const option of item.checklist)text('- '+option,8.5);
             if(item.note)text((item.answer==='1'?'OBS: ':'NC: ')+item.note,8.5);""",
              )
              data = json.JSONDecoder().raw_decode(html.split("const GUIDE_DATA=", 1)[1])[0]
              percent = data["fields"]["fill_10_7"]
              old = compact(percent)
              calc = percent["calc"]
              calc = re.sub(r'var respostaPlano = .*?var g4 = planoAvaliado \? Number\(respostaPlano\) : 0;', 'var g4 = +this.getField("Group203").value;', calc, flags=re.S)
              calc = calc.replace('if (!planoAvaliado) total--;\r\n\r\n', '')
              assert calc != percent["calc"] and "planoAvaliado" not in calc
              percent["calc"] = calc
              replace(old, compact(percent))
              with path.open("w", newline="") as f:
                  f.write(html)
          
          for name in ("index.html", "sw-guia18.js"):
              path = Path(name)
              source = path.read_text()
              old = "20261107-plano-f4104-v46"
              assert source.count(old) == 1
              path.write_text(source.replace(old, "20261107-plano-sim-nao-v47"))
          PY
          git diff --check
          node scripts/test_pcc_alto_risco_20261107.cjs
      - name: Enviar atualização ao repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html individual.html index.html sw-guia18.js
          git commit -m 'Ajustar respostas dos itens 4.6.3, 4.10.4 e 4.10.5'
          git push origin HEAD:main
