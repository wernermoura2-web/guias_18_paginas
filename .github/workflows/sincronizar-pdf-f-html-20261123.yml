name: Sincronizar PDFs de recepcao e higienizacao com HTML
on:
  push:
    branches: [main]
    paths:
      - scripts/sincronizar_pdf_f_html_20261123.py
      - .github/workflows/sincronizar-pdf-f-html-20261123.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sincronizar-pdf-f-html-20261123
  cancel-in-progress: false
jobs:
  revisar-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar motor de navegador e biblioteca PDF
        run: |
          pip install pymupdf playwright
          python -m playwright install --with-deps chromium
      - name: Validar complemento de impressao
        run: node --check bpf-pdf-paridade-html-v27.js
      - name: Reconstruir paginas 7, 8 e 9 com o desenho do HTML
        run: python scripts/sincronizar_pdf_f_html_20261123.py
      - name: Conferir integridade dos arquivos
        run: git diff --check
      - name: Publicar guias sem alterar as demais paginas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add impressao/Guia_BPF_APPCC_Em_Branco_18_Paginas.pdf impressao/Guia_Editavel_em_Branco.pdf impressao/Guia_Editavel_Simplificado.pdf individual.html equipe.html
          if ! git diff --cached --quiet; then
            git commit -m 'PDFs BPF: sincronizar recepcao e higienizacao com HTML'
            git push origin HEAD:main
          fi
