name: Atualizar a revisão de frases do Guia BPF
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-revisao-enxuta.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ajustar_revisao_bpf.py
      - run: git diff --check && node scripts/test_pcc_alto_risco_20261107.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add individual.html equipe.html index.html revisao-frases.html
          git diff --cached --quiet && exit 0
          git commit -m 'Retirar bloco geral de orientações da revisão de frases'
          git push origin HEAD:main
